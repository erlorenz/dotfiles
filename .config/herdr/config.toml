# herdr — tmux-like, agent-aware terminal multiplexer (https://herdr.dev).
# Runs INSIDE WezTerm; owns panes/sessions and shows agent state.
#
# herdr works with NO config file. This file sets NO overrides on purpose —
# we're on herdr's shipped defaults for now. Kept as a documented placeholder
# for future tweaks. Press  ctrl+b  then  ?  to see the live keymap.
#
# Shipped defaults (for reference — these do NOT need to be declared):
#   prefix                ctrl+b     (coexists with WezTerm's ctrl+a leader)
#   split_vertical        prefix+v
#   split_horizontal      prefix+minus
#   focus pane l/d/u/r    prefix+h / prefix+j / prefix+k / prefix+l
#   new tab               prefix+c
#   new workspace         prefix+shift+n
#   switch workspaces     prefix+w
#   detach                prefix+q
#   help (all bindings)   prefix+?
#
# To override later, add a [keys] section — e.g. core-tmux-style splits:
#   [keys]
#   split_vertical   = "prefix+shift+5"   # %
#   split_horizontal = "prefix+shift+'"   # "
